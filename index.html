<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Донат в игры и продвижение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121417);
      --card: var(--tg-theme-secondary-bg-color, #1c2026);
      --text: var(--tg-theme-text-color, #f3f5f8);
      --hint: var(--tg-theme-hint-color, #9aa3b2);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--hint);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--btn);
      color: var(--btn-text);
      border-color: var(--btn);
    }

    .section-label {
      font-size: 13px;
      color: var(--hint);
      margin: 12px 0 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .packages {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .pkg-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card);
      border: 2px solid transparent;
      cursor: pointer;
    }

    .pkg-card.active {
      border-color: var(--btn);
    }

    .pkg-price {
      font-weight: 700;
      color: var(--btn);
    }

    .summary {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Магазин услуг</h1>
  <p class="subtitle" id="user-greeting">Выберите раздел и заполните данные</p>

  <div class="tabs">
    <button class="tab-btn active" id="tab-games" onclick="switchTab('games')">🎮 Донат в игры</button>
    <button class="tab-btn" id="tab-smm" onclick="switchTab('smm')">📈 Накрутка</button>
  </div>

  <!-- РАЗДЕЛ ДОНАТА В ИГРЫ -->
  <div id="panel-games">
    <div class="section-label">Игра</div>
    <select id="game-select" onchange="onGameChange()"></select>

    <div class="section-label">Пакет пополнения</div>
    <div class="packages" id="game-packages"></div>

    <div class="section-label">Player ID / UID / тег или ник</div>
    <input id="game-target" type="text" placeholder="Например: 5123456789" />
  </div>

  <!-- РАЗДЕЛ НАКРУТКИ СОЦСЕТЕЙ -->
  <div id="panel-smm" style="display: none;">
    <div class="section-label">Платформа</div>
    <select id="platform-select" onchange="onPlatformChange()"></select>

    <div class="section-label">Услуга</div>
    <select id="service-select" onchange="updateTotal()"></select>

    <div class="section-label">Количество (шт.)</div>
    <input id="smm-qty" type="number" value="1000" min="20" step="10" oninput="updateTotal()" />

    <div class="section-label">Ссылка на профиль, канал или пост</div>
    <input id="smm-link" type="url" placeholder="https://t.me/..." />
  </div>

  <div class="summary">
    <span>Итого к оплате:</span>
    <strong id="total-price">0 ₽</strong>
  </div>

  <button class="submit-btn" onclick="submitOrder()">Оформить заказ</button>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u && u.first_name) {
        document.getElementById("user-greeting").textContent = `Привет, ${u.first_name}! Выберите услугу или пакет`;
      }
    }

    const GAMES_DATA = {
      pubg: {
        name: "PUBG Mobile",
        packages: [
          { title: "60 UC", price: 75 },
          { title: "180 UC", price: 189 },
          { title: "325 UC", price: 350 },
          { title: "660 UC", price: 670 },
          { title: "1.800 UC", price: 1500 },
          { title: "2.100 UC", price: 2000 },
          { title: "3.250 UC", price: 0 },
          { title: "3.750 UC", price: 3000 },
          { title: "6.000 UC", price: 5000 }
        ]
      },
      roblox: {
        name: "Roblox",
        packages: [
          { title: "80 Robux", price: 80 },
          { title: "400 Robux", price: 420 },
          { title: "800 Robux", price: 800 }
        ]
      },
      freefire: {
        name: "Free Fire",
        packages: [
          { title: "100 алмазов", price: 85 },
          { title: "347 алмазов", price: 290 },
          { title: "572 алмазов", price: 500 }
        ]
      },
      brawl: {
        name: "Brawl Stars",
        packages: [
          { title: "30 гемов", price: 180 },
          { title: "80 гемов", price: 420 },
          { title: "Brawl Pass Plus", price: 790 }
        ]
      },
      clash: {
        name: "Clash Royale",
        packages: [
          { title: "80 гемов", price: 90 },
          { title: "500 гемов", price: 490 },
          { title: "Pass Royale", price: 650 }
        ]
      }
    };

    const SMM_PLATFORMS = {
      tg: "✈️ Telegram",
      tt: "🎵 TikTok"
    };

    const SMM_SERVICES = [
      { platform: "tg", name: "Подписчики", pricePer1k: 700, min: 50, max: 50000 },
      { platform: "tg", name: "Просмотры", pricePer1k: 65, min: 100, max: 200000 },
      { platform: "tg", name: "Реакции положительные", pricePer1k: 150, min: 50, max: 50000 },
      { platform: "tg", name: "Реакции негатив", pricePer1k: 250, min: 50, max: 50000 },
      { platform: "tg", name: "Репосты", pricePer1k: 250, min: 20, max: 20000 },
      { platform: "tt", name: "Лайки", pricePer1k: 420, min: 50, max: 100000 },
      { platform: "tt", name: "Подписчики", pricePer1k: 2100, min: 50, max: 50000 },
      { platform: "tt", name: "Просмотры", pricePer1k: 80, min: 100, max: 500000 },
      { platform: "tt", name: "Репосты", pricePer1k: 200, min: 50, max: 50000 }
    ];

    let currentTab = "games";
    let selectedPkgIndex = 0;

    function notifyUser(msg) {
      if (tg && tg.showAlert) {
        tg.showAlert(msg);
      } else {
        alert(msg);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tab-games").classList.toggle("active", tab === "games");
      document.getElementById("tab-smm").classList.toggle("active", tab === "smm");
      document.getElementById("panel-games").style.display = tab === "games" ? "block" : "none";
      document.getElementById("panel-smm").style.display = tab === "smm" ? "block" : "none";
      updateTotal();
    }

    function initGames() {
      const sel = document.getElementById("game-select");
      sel.innerHTML = "";
      Object.entries(GAMES_DATA).forEach(([code, game]) => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = game.name;
        sel.appendChild(opt);
      });
      onGameChange();
    }

    function onGameChange() {
      selectedPkgIndex = 0;
      renderPackages();
      updateTotal();
    }

    function renderPackages() {
      const gameCode = document.getElementById("game-select").value;
      const pkgs = GAMES_DATA[gameCode].packages;
      const container = document.getElementById("game-packages");
      container.innerHTML = "";

      pkgs.forEach((pkg, idx) => {
        const div = document.createElement("div");
        div.className = "pkg-card" + (idx === selectedPkgIndex ? " active" : "");
        div.innerHTML = `<span>${pkg.title}</span><span class="pkg-price">${pkg.price} ₽</span>`;
        div.onclick = () => {
          selectedPkgIndex = idx;
          renderPackages();
          updateTotal();
        };
        container.appendChild(div);
      });
    }

    function initSmm() {
      const platSel = document.getElementById("platform-select");
      platSel.innerHTML = "";
      Object.entries(SMM_PLATFORMS).forEach(([code, title]) => {
        const opt = document.createElement("option");
        opt.value = code;
        opt.textContent = title;
        platSel.appendChild(opt);
      });
      onPlatformChange();
    }

    function onPlatformChange() {
      const platCode = document.getElementById("platform-select").value;
      const srvSel = document.getElementById("service-select");
      srvSel.innerHTML = "";

      SMM_SERVICES.forEach((srv, idx) => {
        if (srv.platform === platCode) {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = `${srv.name} (${srv.pricePer1k} ₽ / 1000)`;
          srvSel.appendChild(opt);
        }
      });
      updateTotal();
    }

    function calculateTotal() {
      if (currentTab === "games") {
        const gameCode = document.getElementById("game-select").value;
        return GAMES_DATA[gameCode].packages[selectedPkgIndex].price;
      }
      const srvIdx = Number(document.getElementById("service-select").value);
      const srv = SMM_SERVICES[srvIdx];
      const qty = Number(document.getElementById("smm-qty").value) || 0;
      return Math.round(((qty / 1000) * srv.pricePer1k) * 100) / 100;
    }

    function updateTotal() {
      const total = calculateTotal();
      document.getElementById("total-price").textContent = `${total} ₽`;
    }

    function submitOrder() {
      let payload;

      if (currentTab === "games") {
        const gameCode = document.getElementById("game-select").value;
        const gameName = GAMES_DATA[gameCode].name;
        const pkg = GAMES_DATA[gameCode].packages[selectedPkgIndex];
        const target = document.getElementById("game-target").value.trim();

        if (!target) {
          notifyUser("Введите ID игрока / UID / тег или ник.");
          return;
        }

        payload = {
          type: "game",
          game: gameName,
          package: pkg.title,
          target: target,
          cost: pkg.price
        };
      } else {
        const srvIdx = Number(document.getElementById("service-select").value);
        const srv = SMM_SERVICES[srvIdx];
        const platName = SMM_PLATFORMS[srv.platform];
        const qty = parseInt(document.getElementById("smm-qty").value, 10);
        const link = document.getElementById("smm-link").value.trim();

        if (!link || (!link.startsWith("http://") && !link.startsWith("https://"))) {
          notifyUser("Ссылка должна начинаться с https://");
          return;
        }
        if (!Number.isInteger(qty) || qty < srv.min || qty > srv.max) {
          notifyUser(`Количество должно быть от ${srv.min} до ${srv.max}.`);
          return;
        }

        payload = {
          type: "smm",
          platform: platName,
          service: srv.name,
          quantity: qty,
          link: link,
          cost: calculateTotal()
        };
      }

      const jsonStr = JSON.stringify(payload);
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        tg.sendData(jsonStr);
      } else {
        notifyUser("Данные заказа (тест вне Telegram):\n" + jsonStr);
      }
    }

    initGames();
    initSmm();
  </script>
</body>
    </html>
